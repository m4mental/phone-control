name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Get Version
      id: get_version
      run: echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Rename Release APK with Version Tag
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        cd app/build/outputs/apk/release
        if [ -f "app-release.apk" ]; then
          cp app-release.apk "PhoneControl-${VERSION}.apk"
        fi

    - name: Extract Commit Notes
      id: commit_notes
      run: |
        echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
        git log -1 --pretty=format:"%B" >> $GITHUB_ENV
        echo "" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        files: |
          app/build/outputs/apk/release/PhoneControl-*.apk
        body: ${{ env.RELEASE_BODY }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
