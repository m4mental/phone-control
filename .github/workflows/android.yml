name: Android Release Build

on:
  push:
    branches: [ "main", "master", "dev", "alpha" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Release Keystore
      if: env.KEYSTORE_BASE64 != ''
      run: |
        mkdir -p keystore
        echo "$KEYSTORE_BASE64" | base64 -d > keystore/phonecontrol-release.jks
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Determine Version and Release Channel
      id: channel
      run: |
        BRANCH="${GITHUB_REF_NAME}"
        RUN_NUM="${{ github.run_number }}"
        SHORT_SHA=$(git rev-parse --short HEAD)

        if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
          TAG="v1.0.${RUN_NUM}"
          TITLE="Official Release v1.0.${RUN_NUM}"
          APK_NAME="PhoneControl-v1.0.${RUN_NUM}.apk"
          IS_PRERELEASE="false"
        elif [ "$BRANCH" = "dev" ]; then
          TAG="beta-latest"
          TITLE="Beta Channel (Build ${RUN_NUM})"
          APK_NAME="PhoneControl-Beta.apk"
          IS_PRERELEASE="true"
        elif [ "$BRANCH" = "alpha" ]; then
          TAG="alpha-latest"
          TITLE="Alpha Rolling Build (${SHORT_SHA})"
          APK_NAME="PhoneControl-Alpha.apk"
          IS_PRERELEASE="true"
        else
          TAG="${BRANCH}-build-${RUN_NUM}"
          TITLE="Build ${TAG}"
          APK_NAME="PhoneControl-${BRANCH}.apk"
          IS_PRERELEASE="true"
        fi

        echo "TAG=${TAG}" >> $GITHUB_OUTPUT
        echo "TITLE=${TITLE}" >> $GITHUB_OUTPUT
        echo "APK_NAME=${APK_NAME}" >> $GITHUB_OUTPUT
        echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

    - name: Rename Release APK with Channel Tag
      run: |
        APK_NAME="${{ steps.channel.outputs.APK_NAME }}"
        cd app/build/outputs/apk/release
        if [ -f "app-release.apk" ]; then
          cp app-release.apk "${APK_NAME}"
        fi

    - name: Format Automated Changelog and Release Notes
      id: commit_notes
      run: |
        BRANCH="${GITHUB_REF_NAME}"
        TAG="${{ steps.channel.outputs.TAG }}"
        APK="${{ steps.channel.outputs.APK_NAME }}"
        COMMIT_MSG=$(git log -1 --pretty=format:"%B")
        SHORT_SHA=$(git rev-parse --short HEAD)
        DATE_STR=$(date -u +"%Y-%m-%d %H:%M UTC")

        echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
        echo "## 📱 Phone Control Release — ${TAG}" >> $GITHUB_ENV
        echo "" >> $GITHUB_ENV
        echo "**Channel:** \`${BRANCH}\` • **Commit:** \`${SHORT_SHA}\` • **Date:** \`${DATE_STR}\`" >> $GITHUB_ENV
        echo "" >> $GITHUB_ENV
        echo "### 📝 Changes in this Build" >> $GITHUB_ENV
        echo "${COMMIT_MSG}" >> $GITHUB_ENV
        echo "" >> $GITHUB_ENV
        echo "---" >> $GITHUB_ENV
        echo "### 📦 Package & Security Details" >> $GITHUB_ENV
        echo "- **APK Asset:** \`${APK}\`" >> $GITHUB_ENV
        echo "- **Signing:** Unified Cryptographic Release Keystore (Zero Conflict)" >> $GITHUB_ENV
        echo "- **R8 Minification:** Enabled (Dead Code & Resources Stripped)" >> $GITHUB_ENV
        echo "- **Architecture:** Universal ARM64-v8a" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.channel.outputs.TAG }}
        name: ${{ steps.channel.outputs.TITLE }}
        files: |
          app/build/outputs/apk/release/${{ steps.channel.outputs.APK_NAME }}
        body: ${{ env.RELEASE_BODY }}
        draft: false
        prerelease: ${{ steps.channel.outputs.IS_PRERELEASE == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
